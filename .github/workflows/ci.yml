# CI: przy pushu na main i przy pull requeście sprawdza lint, typy, testy i build.
# CD robi Vercel: po pushu na main sam buduje i wdraża nową wersję.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nowy push przerywa poprzednie sprawdzanie tej samej gałęzi
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sprawdzenie:
    name: Lint, typy, testy, build
    runs-on: ubuntu-latest
    # Zawieszony krok (np. test, który czeka w nieskończoność) nie blokuje runnera na 6 godzin
    timeout-minutes: 10
    steps:
      # Akcje przypięte do konkretnego commita: tag można przesunąć, commita nie
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Token GitHuba nie zostaje w .git/config na czas npm ci, testów i buildu
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typy (TypeScript)
        run: npx next typegen && npx tsc --noEmit

      - name: Testy
        run: npm test

      - name: Build
        run: npm run build
